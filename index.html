<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music — mrsiktyyy</title>
<meta name="theme-color" content="#030303">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="logo"><span class="dot"></span>Music</div>
  <input id="search" type="search" placeholder="Поиск песен" aria-label="Поиск песен" autocomplete="off">
</header>

<main>
  <section class="hero">
    <div class="cover big" id="heroCover"></div>
    <div>
      <h1>Мои треки</h1>
      <p id="count"></p>
      <button class="play-all" id="playAll">Слушать</button>
      <button class="ghost" id="shuffleAll">Вперемешку</button>
    </div>
  </section>
  <ol id="list" class="list"></ol>
  <p id="empty" class="empty" hidden>Ничего не найдено. Попробуйте другое название.</p>
</main>

<footer class="player" id="player">
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Перемотка">
  <div class="row">
    <div class="now">
      <div class="cover" id="nowCover"></div>
      <div class="meta"><b id="nowTitle">Выберите песню</b><span id="nowArtist"></span></div>
    </div>
    <div class="ctrl">
      <button id="shuffle" title="Перемешать" aria-pressed="false">⤮</button>
      <button id="prev" title="Предыдущий">⏮</button>
      <button id="play" class="main" title="Играть">▶</button>
      <button id="next" title="Следующий">⏭</button>
      <button id="repeat" title="Повтор" aria-pressed="false">⟲</button>
    </div>
    <div class="side">
      <span id="time">0:00 / 0:00</span>
      <input id="vol" type="range" min="0" max="100" value="80" aria-label="Громкость">
    </div>
  </div>
</footer>
<audio id="audio" preload="metadata"></audio>

<script type="module" src="js/app.js"></script>
</body>
</html>
