<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music — MC killler</title>
<meta name="theme-color" content="#000">
<link rel="icon" href="icons/logo.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <button id="menu" class="ib" data-ic="menu" aria-label="Меню"></button>
  <a class="logo" href="#home"><span data-ic="logo"></span>Music</a>
  <label class="search"><span data-ic="search"></span><input id="search" type="search" placeholder="Поиск треков и плейлистов" autocomplete="off"></label>
</header>

<nav id="side" class="side">
  <a href="#home" data-r="home"><span data-ic="home"></span>Главная</a>
  <a href="#explore" data-r="explore"><span data-ic="explore"></span>Навигатор</a>
  <a href="#library" data-r="library"><span data-ic="library"></span>Библиотека</a>
  <hr>
  <div id="sidePl"></div>
</nav>

<main id="view"></main>

<aside id="queue" class="queue" hidden>
  <div class="qh"><b>Далее</b><button class="ib" id="qclose" aria-label="Закрыть">✕</button></div>
  <div id="qlist"></div>
</aside>

<footer class="player">
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Перемотка">
  <div class="ctl">
    <button class="ib" id="prev" data-ic="prev" aria-label="Предыдущий"></button>
    <button class="ib big" id="play" data-ic="play" aria-label="Играть"></button>
    <button class="ib" id="next" data-ic="next" aria-label="Следующий"></button>
    <span id="time" class="time">0:00 / 0:00</span>
  </div>
  <div class="now"><div class="cover" id="nowCover"></div><div class="meta"><b id="nowTitle">Ничего не играет</b><span id="nowArtist"></span></div>
    <button class="ib" id="like" data-ic="like" aria-label="Нравится"></button></div>
  <div class="ex">
    <input id="vol" type="range" min="0" max="100" value="80" aria-label="Громкость">
    <button class="ib" id="repeat" data-ic="repeat" aria-label="Повтор"></button>
    <button class="ib" id="shuffle" data-ic="shuffle" aria-label="Перемешать"></button>
    <button class="ib" id="qbtn" data-ic="queue" aria-label="Очередь"></button>
  </div>
</footer>
<audio id="audio" preload="metadata"></audio>
<script type="module" src="js/app.js"></script>
</body>
</html>
